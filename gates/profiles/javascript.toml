# JavaScript gate profile. Assumes prettier and eslint as devDependencies, and an `npm test`
# script that enforces its own coverage threshold (e.g. vitest --coverage or jest --coverage
# with coverageThreshold). For TypeScript projects use the typescript profile instead.
test_globs = ["test/**", "tests/**", "**/__tests__/**", "**/*.test.js", "**/*.spec.js", "**/*.test.mjs", "**/*.test.cjs", "**/*.test.jsx", "**/*.spec.jsx"]

[[step]]
name = "format"
category = "format"
cmd = "npx --no-install prettier --check ."
stages = ["pre-commit", "pre-push", "ci"]
when_files = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx"]
requires_paths = ["node_modules"]

[[step]]
name = "lint"
category = "lint"
cmd = "npx --no-install eslint ."
stages = ["pre-commit", "pre-push", "ci"]
when_files = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx"]
requires_paths = ["node_modules"]

[[step]]
name = "test"
category = "test"
cmd = "npm test"
stages = ["pre-push", "ci"]
requires_paths = ["package.json"]

[[step]]
name = "audit"
category = "security"
cmd = "npm audit --audit-level=high"
stages = ["ci"]
requires_paths = ["package-lock.json"]

[[step]]
name = "mutation"
category = "mutation"
cmd = "npx --no-install stryker run"
stages = ["ci"]
advisory = true
timeout = 3600
requires_paths = ["node_modules/@stryker-mutator/core"]

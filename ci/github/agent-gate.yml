# agentic-dev-kit: runs the same gate as the local hooks, at the ci stage.
# Make "agent-gate" a required status check under branch protection for main.
name: agent-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: stacks
        name: Read stacks from .agentic/config.toml
        run: echo "list=,$(python .agentic/kit/gates/gate.py print-stacks)," >> "$GITHUB_OUTPUT"

      - name: Python tools
        if: contains(steps.stacks.outputs.list, ',python,')
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi
          pip install ruff mypy pytest pytest-cov pip-audit mutmut

      - name: Node
        if: contains(steps.stacks.outputs.list, ',javascript,') || contains(steps.stacks.outputs.list, ',typescript,')
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node dependencies
        if: contains(steps.stacks.outputs.list, ',javascript,') || contains(steps.stacks.outputs.list, ',typescript,')
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: .NET
        if: contains(steps.stacks.outputs.list, ',dotnet,')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: .NET restore
        if: contains(steps.stacks.outputs.list, ',dotnet,')
        run: dotnet restore

      - name: Go
        if: contains(steps.stacks.outputs.list, ',go,')
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go tools
        if: contains(steps.stacks.outputs.list, ',go,')
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if [ -f .golangci.yml ]; then go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest; fi

      - name: Rust
        if: contains(steps.stacks.outputs.list, ',rust,')
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust tools
        if: contains(steps.stacks.outputs.list, ',rust,')
        run: cargo install cargo-audit --locked

      - name: C++ tools
        if: contains(steps.stacks.outputs.list, ',cpp,')
        run: sudo apt-get update && sudo apt-get install -y cmake clang-format clang-tidy cppcheck

      - name: Lua
        if: contains(steps.stacks.outputs.list, ',lua,')
        uses: leafo/gh-actions-lua@v10
      - name: LuaRocks
        if: contains(steps.stacks.outputs.list, ',lua,')
        uses: leafo/gh-actions-luarocks@v4
      - name: Lua tools
        if: contains(steps.stacks.outputs.list, ',lua,')
        run: |
          luarocks install busted
          luarocks install luacheck
          luarocks install luacov
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -o stylua.zip -d "$HOME/.local/bin" && chmod +x "$HOME/.local/bin/stylua"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Gate
        run: python .agentic/kit/gates/gate.py run --stage ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: .agentic/reports/

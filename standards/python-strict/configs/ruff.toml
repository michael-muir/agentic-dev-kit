# agentic-dev-kit standards pack: python-strict
# ruff.toml takes precedence over [tool.ruff] in pyproject.toml. Keep ruff settings in one place.
line-length = 88
extend-exclude = [".agentic"]

[lint]
select = [
  "E", "W", "F", "I", "N", "D", "UP", "B",   # python-pep8 base
  "A",        # builtins shadowing
  "ANN",      # annotations
  "ARG",      # unused arguments
  "C4",       # comprehensions
  "DTZ",      # timezone-aware datetimes
  "ERA",      # commented-out code
  "PL",       # pylint
  "PTH",      # pathlib
  "RET",      # return statements
  "RUF",      # ruff-specific
  "S",        # bandit security
  "SIM",      # simplify
  "T20",      # print statements
  "TRY",      # exception handling
]
ignore = [
  "ANN401",   # Any is sometimes the honest type. Review it instead.
  "TRY003",   # long messages in exceptions are fine
  "PLR0913",  # argument count: a review matter
]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN", "PLR2004", "ARG"]
"**/test_*.py" = ["D", "S101", "ANN", "PLR2004", "ARG"]

[format]
quote-style = "double"
docstring-code-format = true

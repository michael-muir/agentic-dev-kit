# agentic-dev-kit standards pack: python-strict
[mypy]
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
exclude = (^\.agentic/|^build/|^dist/|^\.venv/)

# Third-party packages without type hints: add a section per package rather than
# turning ignore_missing_imports on globally.
# [mypy-somepackage.*]
# ignore_missing_imports = True

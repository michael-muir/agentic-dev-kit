# agentic-dev-kit standards pack: go-effective (golangci-lint v2 config format)
version: "2"
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive               # successor to golint: exported-symbol docs, naming
    - errorlint            # errors.Is / errors.As / %w wrapping
    - misspell
  exclusions:
    paths:
      - .agentic
formatters:
  enable:
    - gofmt
    - goimports
